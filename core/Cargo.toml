[package]
name = "novelnote_core"
version = "0.1.0-alpha.1"
description = "Core shared types for NovelNote, a self-hosted book tracker"
categories = ["api-bindings"]
authors.workspace = true
edition.workspace = true
readme.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true

[lints]
workspace = true

[dependencies]
email_address = { version = "0.2.9", default-features = false }
lettre.workspace = true
rkyv = { workspace = true, features = ["uuid-1"] }
serde.workspace = true
thiserror.workspace = true
uuid.workspace = true

[dev-dependencies]
proptest = { version = "1.11.0", default-features = false, features = ["std"] }
proptest-derive = "0.8.0"
serde_json = "1.0.151"

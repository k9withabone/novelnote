# Clippy configuration

absolute-paths-allowed-crates = ["leptos"]
absolute-paths-max-segments = 3
allowed-duplicate-crates = [
  # `confique`, `leptos`, `rkyv`, `test-log`, `tracing`, and `utoipa` use `syn@2`
  "syn",

  # `jiff` uses `bitflags@1`
  "bitflags",

  # `leptos` dependencies
  "foldhash",
  "hashbrown",
  "convert_case",
  "thiserror",
  "thiserror-impl",
  "getrandom",
  "winnow",
]
allowed-idents-below-min-chars = ["s", "f", "v", "M", ".."]
doc-valid-idents = ["NovelNote", "SQLite", ".."]
semicolon-outside-block-ignore-multiline = true
